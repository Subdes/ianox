# Flatpak manifest for ianox (pre-alpha).
#
# Build and install from a checkout of the repository:
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.subdes.ianox.yml
# Make a distributable bundle:
#   flatpak-builder --force-clean --repo=repo build-dir packaging/flatpak/io.github.subdes.ianox.yml
#   flatpak build-bundle repo ianox-0.0.3.flatpak io.github.subdes.ianox
#
# This manifest downloads npm and cargo dependencies while it builds (`--share=network`),
# which is fine for a local build or a bundle but not accepted by Flathub, which needs
# vendored sources.
#
# Limits inside the Flatpak sandbox:
#  - The integrated terminal and the agent's shell commands run inside the sandbox, not on
#    the host, and there is no nested `bubblewrap`, so commands are not sandboxed further.
#  - There is no tray icon unless libayatana-appindicator is added to the runtime.

app-id: io.github.subdes.ianox
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: ianox

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Projects live anywhere in the home directory.
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/ianox/cargo

modules:
  - name: ianox
    buildsystem: simple
    build-commands:
      - npm ci
      # `tauri build` (not plain `cargo build`) embeds the interface into the binary.
      - npx tauri build --no-bundle
      - install -Dm755 src-tauri/target/release/ianox /app/bin/ianox
      - install -Dm644 packaging/io.github.subdes.ianox.desktop /app/share/applications/io.github.subdes.ianox.desktop
      - install -Dm644 packaging/io.github.subdes.ianox.metainfo.xml /app/share/metainfo/io.github.subdes.ianox.metainfo.xml
      # Inside Flatpak the desktop file and the icon carry the application id.
      - sed -i 's|<launchable type="desktop-id">ianox.desktop|<launchable type="desktop-id">io.github.subdes.ianox.desktop|; s|<icon type="stock">ianox<|<icon type="stock">io.github.subdes.ianox<|' /app/share/metainfo/io.github.subdes.ianox.metainfo.xml
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.subdes.ianox.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.subdes.ianox.png
      - install -Dm644 src-tauri/icons/source.png /app/share/icons/hicolor/512x512/apps/io.github.subdes.ianox.png
      - install -Dm644 branding/ianox-icon.svg /app/share/icons/hicolor/scalable/apps/io.github.subdes.ianox.svg
      - install -Dm644 packaging/man/ianox.1 /app/share/man/man1/ianox.1
      - install -Dm644 LICENSE /app/share/licenses/io.github.subdes.ianox/LICENSE
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/licenses/io.github.subdes.ianox/THIRD_PARTY_NOTICES.md
    sources:
      # The repository this manifest lives in. For a release build, replace with:
      #   - type: git
      #     url: https://github.com/Subdes/ianox.git
      #     tag: v0.0.1
      - type: dir
        path: ../..
