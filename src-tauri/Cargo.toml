[package]
name = "ianox"
version = "0.0.3"
description = "ianox — local AI gateway, model manager and coding agent for the desktop (pre-alpha)"
authors = ["Subdes"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Subdes/ianox"
homepage = "https://github.com/Subdes/ianox"
readme = "../README.md"
keywords = ["ai", "llm", "gateway", "agent", "tauri"]

[lib]
name = "ianox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

# Pasarela local
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process", "io-util"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
] }
futures-util = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
open = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tauri-plugin-single-instance = "2.0.0-rc.5"
tauri-plugin-global-shortcut = "2"
fontdb = "0.24.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
