<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo: Sombra profunda estilo dark IDE -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0c0d11"/>
    </linearGradient>

    <!-- Naranja Soplos 3.0 oficial -->
    <linearGradient id="orangeCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d5c"/>
      <stop offset="100%" stop-color="#ff7d2e"/>
    </linearGradient>

    <!-- Bisel interior de ventana/tile -->
    <linearGradient id="border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- 1. Tile base redondeado -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- 2. Símbolo del Gateway / Terminal de IA: El Chevron (Prompt de entrada) + Nodo de Enrutamiento Soplos -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- El Chevron de terminal '>': sólido, afilado, grueso -->
    <path d="M 140 160 L 250 256 L 140 352" stroke="#ffffff" stroke-width="44"/>

    <!-- El Nodo de IA / Gateway local: el bloque central activo con el naranja de Soplos 3.0 -->
    <rect x="290" y="226" width="90" height="60" rx="16" fill="url(#orangeCore)" stroke="none"/>
  </g>
</svg>

